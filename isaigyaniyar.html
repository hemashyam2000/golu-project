  <h1>Isaigyaniyar</h1>
  <p>Isaigyaniar- The only family in the entire Shaivite tradition where husband, wife and son are recognized as individual nayanmars is the Sundarar family. Father- Sadayar Nayanar, Mother- Isaigyaniyar and Son- Sundara moorthy Nayanar.</p>
